<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #f0f0f0;
            gap: 1rem;
        }

        .container div {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 10px 20px;
            color: white;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .nav-links li a {
            color: white;
            text-decoration: none;
        }

        .nav-links li a:hover {
            text-decoration: underline;
            color:orange;
            background-color: black;
        }

    </style>
</head>
<body>
    <nav class="navbar">
        <div>Logo</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
       
    </nav>
    <div class="container">
        <div>item 1</div>
        <div>item 2</div>
        <div>item 3</div>
    </div>
    <div>item 4</div>
    
</body>
</html>
