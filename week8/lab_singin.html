<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-sm border-0" style="width: 100%; max-width: 420px;">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Sign In</h3>

                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Sign In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>

        const email = document.getElementById("email");
        const password = document.getElementById("password");

        function validateEmail(email) {
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email.value)) {
                email.setCustomValidity("Please enter a valid email address.");
                return false;
            } else {
                email.setCustomValidity("");
                return true;
            }
        }

        function validatePassword() {
            if (password.value.trim() === '') {
                password.setCustomValidity("Please enter your password.");
                return false;
            } else if (password.value.length < 6) {
                password.setCustomValidity("Password must be at least 6 characters long.");
                return false;
            } else {
                password.setCustomValidity("");
                return true;
            }
        }

        email.addEventListener("input", function() {
            if(email.value.trim !== ""){
                validateEmail();
            }
        });
        
        password.addEventListener("input", function() {
            if(password.value.trim !== ""){
                validatePassword();
            }
        });
        
        document.querySelector("form").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent form submission

            if(email.value && password.value) {
                alert(`sign in with Email: ${email.value}`);
            } else {
                alert("Please fill in both fields.");
            }
        });
    </script>
   
</body>
</html>
