<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Contect Page</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#contact">Contect</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="contact">
            <h2>Contact Us</h2>
            <p>Please fill out the form below to get in touch with us.</p>
            <form action="#" method="post" >
                <label for="txtname">Name:</label>
                <input type="text" id="txtname" name="txtname" required maxlength="30">
                <br><br>
                <label for="txtemail">Email:</label>
                <input type="email" id="txtemail" name="txtemail" required pattern="^[A-za-z0-9
            _%+-]+@[A-za-z0-9.-]+\.[a-z]{2,}$" title="Please enter valid email address">
                <br><br>
                <label for="txtphone">Email:</label>
                <input type="tel" id= "txtphone" name="txtphone" required patterm="[0-9]{10}" title="Plaese enter valid numder Phone">
                <br><br>
                <label for="txtmessage">Message:</label>
                <textarea id="txtmessage "name="txtmessage" ></textarea>
                <br><br>

            <fieldset>
                <legend>Prefer Contact method</legend>
                <label for="contactphone">Phone</label>
                <input type="radio" id="contactphone" name="contactMathod">
                <label for="contactemail">Email</label>
                <input type="radio" id="contactemail" name="contactMathod" value="email" checked>
            </fieldset>
            
            <br><input type="submit">
            <input type="reset">

        </section>
    </main>
    <footer>
        <p>@ 2026 Contact page</p>
    </footer>
    
</body>
</html>
